name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -d "android-project" ] && [ -f "android-project/gradlew" ]; then
            cd android-project && chmod +x gradlew
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "No gradlew script found. Skipping chmod."
          fi

      - name: Build Debug APK
        run: |
          if [ -d "android-project" ] && [ -f "android-project/gradlew" ]; then
            cd android-project && ./gradlew assembleDebug --stacktrace
          elif [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "No Gradle project found. Running web app build..."
            npm ci || npm install
            npm run build
          fi

      - name: Build Release APK
        run: |
          if [ -d "android-project" ] && [ -f "android-project/gradlew" ]; then
            cd android-project && ./gradlew assembleRelease --stacktrace
          elif [ -f "gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            echo "Skipping Gradle release build (no Gradle wrapper)."
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PashtoPoetry-Debug-APKs
          path: |
            android-project/app/build/outputs/apk/debug/app-debug.apk
            android-project/admin/build/outputs/apk/debug/admin-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PashtoPoetry-Release-APKs
          path: |
            android-project/app/build/outputs/apk/release/
            android-project/admin/build/outputs/apk/release/
            app/build/outputs/apk/release/
          if-no-files-found: warn
